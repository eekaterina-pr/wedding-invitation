<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
overflow:hidden;
background:#f7f3ee;
font-family:Manrope;
}

/* BACKGROUND LAYERS */
.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 40%),
radial-gradient(circle at 80% 60%, #efe3d6 0%, transparent 45%),
linear-gradient(180deg,#f7f3ee,#f2ebe2);
filter:blur(0px);
animation:slowMove 12s ease-in-out infinite alternate;
}

@keyframes slowMove{
0%{transform:scale(1)}
100%{transform:scale(1.05)}
}

/* ENVELOPE */
.center{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
position:relative;
z-index:2;
}

.envelope{
width:340px;
height:220px;
position:relative;
cursor:pointer;
transform:translateY(30px);
opacity:0;
animation:appear 2s ease forwards;
}

@keyframes appear{
to{opacity:1;transform:translateY(0)}
}

.body{
width:100%;
height:100%;
background:rgba(255,255,255,0.6);
backdrop-filter:blur(12px);
border-radius:18px;
border:1px solid rgba(198,167,125,0.25);
box-shadow:0 30px 80px rgba(0,0,0,0.12);
}

/* FLAP */
.flap{
position:absolute;
top:0;
left:0;
width:100%;
height:120px;
background:rgba(230,220,210,0.9);
clip-path:polygon(0 0,100% 0,50% 60%);
transform-origin:top;
transition:1.2s ease;
}

/* TEXT */
.title{
margin-top:30px;
text-align:center;
font-family:"Cormorant Garamond";
font-size:26px;
letter-spacing:1px;
color:#111;
}

.btn{
margin-top:20px;
padding:12px 28px;
border-radius:999px;
border:1px solid #C6A77D;
background:rgba(255,255,255,0.3);
backdrop-filter:blur(10px);
cursor:pointer;
transition:.4s;
}

.btn:hover{
transform:translateY(-2px);
background:#C6A77D;
color:white;
}

.fade{
position:fixed;
inset:0;
background:#f7f3ee;
opacity:0;
pointer-events:none;
transition:1.5s ease;
}

.fade.active{
opacity:1;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="center">

<div class="envelope" id="env">
<div class="flap" id="flap"></div>
<div class="body"></div>

<div style="position:absolute;top:55%;width:100%;text-align:center;">
<div class="title">Приглашение на свадьбу</div>
<button class="btn" onclick="openInvite()">Открыть</button>
</div>

</div>

</div>

<div class="fade" id="fade"></div>

<script>

function openInvite(){

// flap animation
document.getElementById("flap").style.transform = "rotateX(180deg)";

// cinematic fade
document.getElementById("fade").classList.add("active");

// redirect to main after animation
setTimeout(()=>{
window.location.href = "#hero";
},1400);
}

</script>

</body>
</html>
