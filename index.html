<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Manrope;
background:#f7f3ee;
overflow-x:hidden;
color:#111;
}

/* ===== BACKGROUND ===== */
.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, #fff 0%, transparent 40%),
radial-gradient(circle at 80% 60%, #efe3d6 0%, transparent 45%),
linear-gradient(180deg,#f7f3ee,#f2ebe2);
animation:floatBg 12s ease-in-out infinite alternate;
z-index:0;
}

@keyframes floatBg{
0%{transform:scale(1)}
100%{transform:scale(1.05)}
}

/* ===== ENVELOPE ===== */
.center{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
position:relative;
z-index:2;
}

.envelope{
width:340px;
height:220px;
position:relative;
cursor:pointer;
}

.body{
width:100%;
height:100%;
background:rgba(255,255,255,0.55);
backdrop-filter:blur(12px);
border-radius:18px;
border:1px solid rgba(198,167,125,0.25);
box-shadow:0 30px 80px rgba(0,0,0,0.12);
}

.flap{
position:absolute;
top:0;
width:100%;
height:120px;
background:rgba(230,220,210,0.9);
clip-path:polygon(0 0,100% 0,50% 60%);
transform-origin:top;
transition:1.2s ease;
}

.title{
position:absolute;
top:55%;
width:100%;
text-align:center;
font-family:"Cormorant Garamond";
font-size:24px;
}

/* ===== HERO ===== */
.hero{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:120px 20px;
}

.hero h1{
font-family:"Cormorant Garamond";
font-size:72px;
font-weight:300;
margin:0;
}

.meta{
margin-top:20px;
color:#C6A77D;
}

/* ===== TIMELINE ===== */
.timeline-section{
padding:120px 20px;
max-width:900px;
margin:auto;
position:relative;
}

/* vertical line */
.line{
position:absolute;
left:50%;
top:0;
bottom:0;
width:2px;
background:linear-gradient(#C6A77D,#e8ddd2);
transform:translateX(-50%);
}

/* item */
.item{
display:flex;
align-items:center;
justify-content:space-between;
margin:80px 0;
position:relative;
opacity:0;
transform:translateY(40px);
transition:1s ease;
}

.item.visible{
opacity:1;
transform:translateY(0);
}

/* pearl */
.pearl{
width:18px;
height:18px;
border-radius:50%;
background:radial-gradient(circle,#fff,#e8ddd2);
box-shadow:0 5px 15px rgba(0,0,0,0.15);
position:absolute;
left:50%;
transform:translateX(-50%);
}

/* text blocks */
.time{
width:40%;
text-align:right;
font-weight:500;
}

.desc{
width:40%;
text-align:left;
opacity:0.8;
}

/* alternating sides */
.item:nth-child(even) .time{
order:2;
text-align:left;
}

.item:nth-child(even) .desc{
text-align:right;
}

/* fade */
.fade{
position:fixed;
inset:0;
background:#f7f3ee;
opacity:0;
pointer-events:none;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- HERO (short version) -->
<section class="hero">
<h1>Денис & Екатерина</h1>
<div class="meta">7 августа 2026 • Челябинск</div>
</section>

<!-- TIMELINE -->
<section class="timeline-section">

<div class="line"></div>

<div class="item">
<div class="time">16:00</div>
<div class="pearl"></div>
<div class="desc">Сбор гостей, фуршет</div>
</div>

<div class="item">
<div class="time">17:00</div>
<div class="pearl"></div>
<div class="desc">Выездная церемония</div>
</div>

<div class="item">
<div class="time">18:00</div>
<div class="pearl"></div>
<div class="desc">Начало банкета</div>
</div>

<div class="item">
<div class="time">21:00</div>
<div class="pearl"></div>
<div class="desc">Свадебный торт</div>
</div>

<div class="item">
<div class="time">22:00</div>
<div class="pearl"></div>
<div class="desc">Танцы и завершение вечера</div>
</div>

</section>

<script>

// scroll animation
const items = document.querySelectorAll(".item");

function reveal(){
items.forEach(el=>{
const top = el.getBoundingClientRect().top;
if(top < window.innerHeight - 100){
el.classList.add("visible");
}
});
}

window.addEventListener("scroll",reveal);
reveal();

</script>

</body>
</html>
