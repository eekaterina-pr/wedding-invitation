<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Manrope;
background:#f7f3ee;
overflow-x:hidden;
color:#111;
}

/* ===== BACKGROUND ===== */
.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%, #fff 0%, transparent 40%),
radial-gradient(circle at 80% 60%, #efe3d6 0%, transparent 45%),
linear-gradient(180deg,#f7f3ee,#f2ebe2);
animation:floatBg 12s ease-in-out infinite alternate;
z-index:0;
}

@keyframes floatBg{
0%{transform:scale(1)}
100%{transform:scale(1.05)}
}

/* ===== ENVELOPE ===== */
.center{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
position:relative;
z-index:2;
}

.envelope{
width:340px;
height:220px;
position:relative;
cursor:pointer;
animation:appear 2s ease forwards;
}

@keyframes appear{
from{opacity:0;transform:translateY(30px)}
to{opacity:1;transform:translateY(0)}
}

.body{
width:100%;
height:100%;
background:rgba(255,255,255,0.55);
backdrop-filter:blur(12px);
border-radius:18px;
border:1px solid rgba(198,167,125,0.25);
box-shadow:0 30px 80px rgba(0,0,0,0.12);
}

.flap{
position:absolute;
top:0;
width:100%;
height:120px;
background:rgba(230,220,210,0.9);
clip-path:polygon(0 0,100% 0,50% 60%);
transform-origin:top;
transition:1.2s ease;
}

.title{
position:absolute;
top:55%;
width:100%;
text-align:center;
font-family:"Cormorant Garamond";
font-size:24px;
letter-spacing:1px;
}

.btn{
margin-top:20px;
padding:12px 28px;
border-radius:999px;
border:1px solid #C6A77D;
background:rgba(255,255,255,0.4);
backdrop-filter:blur(10px);
cursor:pointer;
transition:.4s;
}

.btn:hover{
background:#C6A77D;
color:white;
transform:translateY(-2px);
}

/* ===== HERO ===== */
.hero{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:120px 20px;
position:relative;
z-index:1;
}

.hero h1{
font-family:"Cormorant Garamond";
font-size:72px;
font-weight:300;
letter-spacing:2px;
margin:0;
opacity:0;
animation:fadeUp 1.5s ease forwards;
animation-delay:1.2s;
}

.hero p{
max-width:600px;
margin-top:20px;
font-size:16px;
line-height:1.8;
opacity:0;
animation:fadeUp 1.5s ease forwards;
animation-delay:1.6s;
}

.meta{
margin-top:30px;
color:#C6A77D;
font-size:18px;
opacity:0;
animation:fadeUp 1.5s ease forwards;
animation-delay:2s;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

/* ===== PEARL TIMER ===== */
.timer{
display:flex;
gap:18px;
justify-content:center;
margin-top:60px;
flex-wrap:wrap;
}

.pearl{
width:110px;
height:110px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%, #ffffff, #e8ddd2);
box-shadow:
0 10px 30px rgba(0,0,0,0.12),
inset 0 0 20px rgba(255,255,255,0.6);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
position:relative;
animation:glow 3s ease-in-out infinite alternate;
}

@keyframes glow{
0%{transform:translateY(0px)}
100%{transform:translateY(-4px)}
}

.pearl span{
font-size:22px;
font-weight:500;
font-family:"Cormorant Garamond";
}

.pearl small{
font-size:12px;
opacity:0.7;
letter-spacing:1px;
}

/* FADE */
.fade{
position:fixed;
inset:0;
background:#f7f3ee;
opacity:0;
pointer-events:none;
transition:1.5s ease;
z-index:10;
}

.fade.active{
opacity:1;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- ENVELOPE -->
<div class="center" id="cover">
<div class="envelope">
<div class="flap" id="flap"></div>
<div class="body"></div>

<div style="position:absolute;top:55%;width:100%;text-align:center;">
<div class="title">Приглашение на свадьбу</div>
<button class="btn" onclick="openInvite()">Открыть</button>
</div>

</div>
</div>

<!-- HERO -->
<section class="hero" id="hero">
<h1>Денис & Екатерина</h1>

<p>
Если вы получили это приглашение — значит вы человек, который нам важен и дорог.
Мы будем рады разделить с вами день создания нашей семьи.
</p>

<div class="meta">
7 августа 2026 • 16:00 • Челябинск • Бродоколмакский тракт 3/3
</div>

<!-- PEARL TIMER -->
<div class="timer" id="timer"></div>

</section>

<div class="fade" id="fade"></div>

<script>

function openInvite(){

document.getElementById("flap").style.transform = "rotateX(180deg)";
document.getElementById("fade").classList.add("active");

setTimeout(()=>{
document.getElementById("cover").style.display="none";
document.getElementById("fade").classList.remove("active");
document.getElementById("hero").scrollIntoView({behavior:"smooth"});
},1200);
}

// countdown
function updateTimer(){

const target = new Date("2026-08-07T16:00:00");
const now = new Date();
const diff = target - now;

const days = Math.floor(diff / (1000*60*60*24));
const hours = Math.floor(diff / (1000*60*60)) % 24;
const minutes = Math.floor(diff / (1000*60)) % 60;

document.getElementById("timer").innerHTML = `
<div class="pearl"><span>${days}</span><small>days</small></div>
<div class="pearl"><span>${hours}</span><small>hours</small></div>
<div class="pearl"><span>${minutes}</span><small>min</small></div>
`;
}

setInterval(updateTimer,1000);
updateTimer();

</script>

</body>
</html>
